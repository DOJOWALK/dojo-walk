name: DOJO WALK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/customer-upi-package-request]

jobs:
  admin-build:
    name: Admin TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund --verbose
      - name: Type-check Admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json
      - name: Build Admin
        run: npm run build --workspace @dojowalk/admin

  mobile-export:
    name: Android JavaScript bundle export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund --verbose
      - name: Type-check mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist
